<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Standalone/immersive when installed to the home screen (iPhone's only true
     fullscreen route, since iOS Safari has no element Fullscreen API). -->
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#05060a" />
<title>AEON — Conformal Zoom Visualiser</title>

<!--
  ============================================================================
  AEON — scaffold. RUNS as-is (WebGL boot + placeholder shader), but the
  visualiser logic is intentionally STUBBED. Build it via prompts.md, step by
  step. Read CLAUDE.md for the rules; PLAN.md for the reasoning.

  THE HARD INVARIANT: phase=1 must look identical to phase=0 (seamless loop).
    - JS owns the only clock. Shader receives `phase ∈ [0,1)`. It must NOT
      integrate its own clock for the zoom. `u_time` is COSMETIC ONLY.
    - Only `phase` drives appearance. `logDepth`/`aeonCount` touch the HUD only.

  Architecture: functional core / imperative shell, unidirectional:
    dt → clock.advance → derive(PURE) → gpu.render + hud.update
  ============================================================================
-->

<!-- Distinctive technical type (degrades to system mono offline). Step 3 may refine. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />

<style>
  /* ---- CONFIG: theme tokens (keep visual constants here, not inline) ---- */
  :root {
    --bg:            #05060a;
    --ink:           #c8d4e0;
    --ink-dim:       #6b7686;
    --hairline:      rgba(160,180,210,0.14);
    --panel:         rgba(8,11,18,0.55);
    /* confidence accents — sharp on a restrained base */
    --solid:         #5fd0c8;
    --contested:     #e3b56b; /* amber */
    --interpretive:  #b48cf0;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* safe-area insets + edge gap (mobile-first spacing tokens) */
  :root {
    --safe-t: env(safe-area-inset-top,    0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-l: env(safe-area-inset-left,   0px);
    --safe-r: env(safe-area-inset-right,  0px);
    --edge: 16px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:var(--bg); color:var(--ink);
               font-family:var(--mono); overflow:hidden; }

  /* Mobile-first: the canvas owns all touch input. Kill page gestures (scroll,
     pinch-zoom, pull-to-refresh), text selection, long-press callouts and tap
     highlights so a tap/drag never triggers browser chrome. */
  body { touch-action:none; overscroll-behavior:none;
         -webkit-user-select:none; user-select:none;
         -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  #gl { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  /* atmospheric vignette over the canvas — depth, not flat black */
  #vignette { position:fixed; inset:0; pointer-events:none;
    background: radial-gradient(120% 120% at 50% 50%,
      transparent 55%, rgba(0,0,0,0.55) 100%); }

  /* ===== HUD — scientific-instrument readout (STEP 3) =====================
     Fluid type via clamp(); edges offset by safe-area insets. Confidence is the
     single accent: body[data-conf] sets --accent, inherited by chip, timeline,
     state. The whole overlay reads `phase`/`stage` off the shared clock. ====== */
  .hud { position:fixed; pointer-events:none; font-weight:300;
         letter-spacing:0.04em; text-shadow:0 1px 12px rgba(0,0,0,0.85); }

  /* confidence → accent colour (one source: the palette vars) */
  [data-conf="solid"]        { --accent: var(--solid); }
  [data-conf="contested"]    { --accent: var(--contested); }
  [data-conf="interpretive"] { --accent: var(--interpretive); }

  /* regime chip — top-left: live status dot, stage label, confidence pill */
  #chip { top:calc(var(--safe-t) + var(--edge)); left:calc(var(--safe-l) + var(--edge));
          display:flex; align-items:center; gap:10px; max-width:min(70vw, 520px); }
  #chip .dot { width:8px; height:8px; border-radius:50%; flex:0 0 auto;
               background:var(--accent, var(--solid)); box-shadow:0 0 10px var(--accent, var(--solid)); }
  #chip-label { color:var(--ink); font-size:clamp(12px,3.4vw,15px); letter-spacing:0.1em;
                text-transform:uppercase; white-space:nowrap; }
  #chip-conf { color:var(--accent, var(--solid)); border:1px solid var(--accent, var(--solid));
               border-radius:999px; padding:2px 8px; font-size:clamp(8px,2.2vw,9.5px);
               letter-spacing:0.16em; text-transform:uppercase; opacity:0.9; white-space:nowrap; }

  /* Choptuik mass-scaling inset (top-left, under the chip); fades in via .show */
  #choptuik { left:calc(var(--safe-l) + var(--edge)); top:calc(var(--safe-t) + var(--edge) + 32px);
              width:clamp(150px, 44vw, 184px); opacity:0; transform:translateY(-4px);
              transition:opacity .3s ease, transform .3s ease; }
  #choptuik.show { opacity:0.92; transform:none; }
  #choptuik .cap { font-size:clamp(7.5px,2vw,9px); letter-spacing:0.06em; color:var(--ink-dim);
                   text-transform:uppercase; margin-bottom:2px; }
  #choptuik .cap b { color:var(--ink); font-weight:400; }
  #choptuik svg { width:100%; height:auto; display:block; }
  #ck-axis { stroke:var(--hairline); stroke-width:1; fill:none; }
  #ck-line { stroke:var(--accent, var(--solid)); stroke-width:1.4; opacity:0.85; }
  #ck-dot  { fill:var(--accent, var(--solid)); }
  #choptuik text { fill:var(--ink-dim); font-size:7px; letter-spacing:0.04em; }

  /* Penrose CCC inset (top-right, under the control bar); aeon mode only */
  #penrose { right:calc(var(--safe-r) + var(--edge)); top:calc(var(--safe-t) + var(--edge) + 58px);
             width:clamp(54px, 16vw, 66px); opacity:0.9; }
  #penrose .cap { font-size:clamp(6.5px,1.8vw,8px); color:var(--ink-dim); text-transform:uppercase;
                  letter-spacing:0.04em; margin-bottom:2px; text-align:right; }
  #penrose svg { width:100%; height:auto; display:block; }
  .aeon  { fill:none; stroke:var(--hairline); stroke-width:1; }
  .aeon.cur { stroke:var(--accent, var(--solid)); }
  .xover { fill:none; stroke:var(--ink-dim); stroke-width:0.8; opacity:0.6; }
  #pen-dot { fill:var(--accent, var(--solid)); }
  #penrose text { fill:var(--ink-dim); font-size:6.5px; letter-spacing:0.04em; }
  body.web #penrose { display:none; }

  /* scale ruler line in the dock */
  #scale { text-align:center; font-size:clamp(9px,2.5vw,11px); }
  #scale .sk { color:var(--ink-dim); letter-spacing:0.12em; text-transform:uppercase; font-size:0.85em; }
  #scale .sv { color:var(--ink); font-variant-numeric:tabular-nums; }
  #scale .rg { color:var(--ink-dim); }

  /* bottom dock — caption, stage timeline, stat readout, hint (centered column) */
  #dock { position:fixed; left:50%; transform:translateX(-50%);
          bottom:calc(var(--safe-b) + var(--edge)); z-index:2;
          width:min(720px, calc(100vw - var(--safe-l) - var(--safe-r) - 2*var(--edge)));
          display:flex; flex-direction:column; gap:11px; pointer-events:none; }

  #caption { text-align:center; font-size:clamp(12px,3.4vw,14px); line-height:1.55;
             color:var(--ink); opacity:0.95; }

  /* stage timeline — segments from TIMELINE, tinted by confidence; scrubbable */
  #timeline { position:relative; height:22px; pointer-events:auto; cursor:pointer;
              touch-action:none; }
  #tl-track { position:absolute; left:0; right:0; top:50%; transform:translateY(-50%);
              height:3px; background:var(--hairline); border-radius:2px; overflow:hidden; }
  .tl-seg { position:absolute; top:0; bottom:0; opacity:0.26;
            transition:opacity .2s ease; }
  .tl-seg.c-solid        { background:var(--solid); }
  .tl-seg.c-contested    { background:var(--contested); }
  .tl-seg.c-interpretive { background:var(--interpretive); }
  .tl-seg.on { opacity:0.9; }
  /* show the segment set matching the mode (aeon vs cosmic web) */
  .seg-web { display:none; }
  body.web .seg-aeon { display:none; }
  body.web .seg-web  { display:block; }
  #tl-head { position:absolute; top:1px; bottom:1px; width:2px; margin-left:-1px;
             background:var(--ink); box-shadow:0 0 8px rgba(220,235,255,0.6); }

  /* stat readout — tabular figures so nothing jitters */
  #stats { display:flex; flex-wrap:wrap; justify-content:center; align-items:baseline;
           gap:5px 16px; font-size:clamp(10px,2.7vw,11.5px); }
  .stat { display:flex; gap:6px; align-items:baseline; }
  .sk { color:var(--ink-dim); letter-spacing:0.14em; text-transform:uppercase; font-size:0.85em; }
  .sv { color:var(--ink); font-variant-numeric:tabular-nums; }
  .stat.state .sv { color:var(--accent, var(--solid)); letter-spacing:0.1em; }

  /* control hint (one faint line); touch vs keyboard variants */
  #hint { text-align:center; font-size:clamp(8.5px,2.2vw,10px); color:var(--ink-dim);
          letter-spacing:0.1em; text-transform:uppercase; opacity:0.66; }
  .touch-only { display:inline; }   /* mobile default: touch hints */
  .kbd-only   { display:none;  }

  /* Control buttons — the only interactive HUD elements (pointer-events:auto).
     44px tap targets, laid out right-to-left in a flex bar (hidden buttons just
     collapse out of the row — no manual offsets). */
  #ctl-bar { position:fixed; top:calc(var(--safe-t) + var(--edge)); right:calc(var(--safe-r) + var(--edge));
             display:flex; gap:8px; z-index:3; pointer-events:none; }
  .ctl-btn { width:44px; height:44px; display:grid; place-items:center; padding:0;
             border:1px solid var(--hairline); border-radius:6px; background:var(--panel);
             color:var(--ink-dim); cursor:pointer; pointer-events:auto;
             -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
             transition:color .15s ease, border-color .15s ease; }
  .ctl-btn:hover, .ctl-btn:active { color:var(--ink); border-color:rgba(160,180,210,0.32); }
  .ctl-btn:focus-visible { outline:1px solid var(--solid); outline-offset:2px; }
  .ctl-btn.on { color:var(--accent, var(--solid)); border-color:var(--accent, var(--solid)); }
  .ctl-btn svg { width:20px; height:20px; display:block; }

  /* cosmic-web mode toggle; lit (.on) while zoomed out */
  body.web #mode-btn { color:var(--interpretive); border-color:var(--interpretive); }

  /* fullscreen — icon swaps via body.fs; hidden where there's no Fullscreen API
     (body.no-fs, e.g. iPhone Safari) — the flex row just closes the gap. */
  #fs-btn .ic-exit { display:none; }
  body.fs #fs-btn .ic-enter { display:none; }
  body.fs #fs-btn .ic-exit  { display:block; }
  body.no-fs #fs-btn { display:none; }

  /* show/hide text — eye ↔ eye-off via body.hud-hidden */
  #hud-btn .ic-eyeoff { display:none; }
  body.hud-hidden #hud-btn .ic-eye    { display:none; }
  body.hud-hidden #hud-btn .ic-eyeoff { display:block; }

  /* the text overlay fades out together when hidden (buttons stay) */
  #chip, #dock, #penrose { transition:opacity .25s ease; }
  body.hud-hidden #chip,
  body.hud-hidden #dock,
  body.hud-hidden #choptuik,
  body.hud-hidden #penrose,
  body.hud-hidden #debug { opacity:0; }
  body.hud-hidden #timeline { pointer-events:none; }   /* not scrubbable while hidden */

  #debug { position:fixed; left:calc(var(--safe-l) + var(--edge)); top:calc(var(--safe-t) + 56px);
           font-size:10.5px; color:var(--solid); line-height:1.5; display:none;
           white-space:pre; opacity:0.8; }
  body.debug #debug { display:block; }

  #fatal { position:fixed; inset:0; display:none; place-items:center;
           padding:max(32px, var(--safe-t)) max(24px, var(--safe-r)) max(32px, var(--safe-b)) max(24px, var(--safe-l));
           text-align:center; font-size:13px; color:#ff9a9a; background:var(--bg); }

  /* ≥640px: roomier desktop layout, keyboard hints */
  @media (min-width:640px) {
    :root { --edge:22px; }
    .touch-only{ display:none;  }
    .kbd-only  { display:inline; }
  }
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div id="vignette"></div>

  <!-- HUD — scientific-instrument readout, driven by the HUD sink off the clock -->
  <div id="chip" class="hud">
    <span class="dot"></span>
    <span id="chip-label">—</span>
    <span id="chip-conf">—</span>
  </div>

  <!-- Choptuik mass-scaling inset: M ∝ (p−p*)^γ. A log-log line of slope γ with a
       marker that slides toward the critical point as criticality rises. Shown
       during the critical-collapse stages (aeon mode). -->
  <div id="choptuik" class="hud">
    <div class="cap">critical collapse &nbsp; <b>M ∝ (p−p*)<sup>γ</sup></b> &nbsp; γ=0.37</div>
    <svg viewBox="0 0 110 64" aria-hidden="true">
      <path id="ck-axis" d="M14 8 V54 H104" />
      <line id="ck-line" x1="14" y1="50.5" x2="104" y2="8" />
      <circle id="ck-dot" cx="104" cy="8" r="2.6" />
      <text x="92" y="62">p−p*</text>
      <text x="2" y="12">M</text>
    </svg>
  </div>

  <!-- Penrose CCC inset: conformal aeons stacked in time. A marker rises through
       the current aeon (Big Bang at the bottom → crossover at the top), then resets
       to the next band at the wrap. Aeon mode only. -->
  <div id="penrose" class="hud">
    <div class="cap">CCC · conformal aeons</div>
    <svg viewBox="0 0 64 96" aria-hidden="true">
      <rect class="aeon"     x="7" y="64" width="50" height="26" />
      <rect class="aeon cur" x="7" y="35" width="50" height="26" />
      <rect class="aeon"     x="7" y="6"  width="50" height="26" />
      <path class="xover" d="M7 64 Q 20 60.5 32 64 T 57 64" />
      <path class="xover" d="M7 35 Q 20 31.5 32 35 T 57 35" />
      <circle id="pen-dot" cx="32" cy="61" r="2.6" />
      <text x="57" y="17" text-anchor="end">next</text>
      <text x="7"  y="87">prev</text>
    </svg>
  </div>

  <!-- Control buttons (the only interactive HUD elements), in a right-aligned
       flex bar. Icons swap via body classes; fs-btn collapses out where there's
       no Fullscreen API. Order (left→right): mode · text · fullscreen. -->
  <div id="ctl-bar">
    <button id="mode-btn" class="ctl-btn" type="button" aria-label="Cosmic-web zoom-out mode" title="Cosmic web / aeon (m)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="2.2" /><circle cx="5" cy="6" r="1" /><circle cx="19" cy="7" r="1" />
        <circle cx="18" cy="17" r="1" /><circle cx="6" cy="18" r="1" />
        <path d="M12 12L5 6M12 12l7-5M12 12l6 5M12 12l-6 6" /></svg>
    </button>
    <button id="hud-btn" class="ctl-btn" type="button" aria-label="Show/hide text" title="Show/hide text (h)">
      <svg class="ic-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <circle cx="12" cy="12" r="2.6" /></svg>
      <svg class="ic-eyeoff" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z" />
        <line x1="4" y1="4" x2="20" y2="20" /></svg>
    </button>
    <button id="fs-btn" class="ctl-btn" type="button" aria-label="Toggle fullscreen" title="Fullscreen (f)">
      <svg class="ic-enter" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
      <svg class="ic-exit" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5" /></svg>
    </button>
  </div>

  <!-- bottom dock: caption · stage timeline (scrubbable) · stat readout · hint -->
  <div id="dock" class="hud">
    <div id="caption">—</div>
    <div id="timeline" aria-hidden="true">
      <div id="tl-track"></div>
      <div id="tl-head"></div>
    </div>
    <div id="scale"><span class="sk">scale</span> <span class="sv" id="r-scale">—</span> <span class="rg" id="r-regime">—</span></div>
    <div id="stats">
      <div class="stat"><span class="sk">phase</span><span class="sv" id="r-phase">—</span></div>
      <div class="stat"><span class="sk">aeon</span><span class="sv" id="r-aeon">—</span></div>
      <div class="stat"><span class="sk">depth</span><span class="sv" id="r-depth">—</span></div>
      <div class="stat"><span class="sk">Δ</span><span class="sv" id="r-delta">—</span></div>
      <div class="stat state"><span class="sv" id="r-state">▸ running</span></div>
    </div>
    <div id="hint">
      <span class="touch-only">tap · play/pause &nbsp;·&nbsp; drag · scrub</span>
      <span class="kbd-only">space play/pause &nbsp;·&nbsp; ← → scrub &nbsp;·&nbsp; m cosmic web &nbsp;·&nbsp; h text &nbsp;·&nbsp; f fullscreen &nbsp;·&nbsp; ?phase= jump &nbsp;·&nbsp; ?debug</span>
    </div>
  </div>
  <div id="debug"></div>
  <div id="fatal"></div>

<script>
"use strict";
/* ============================================================================
   1. CONFIG — every magic number lives here. Nothing hardcoded downstream.
   ============================================================================ */
const CONFIG = {
  DELTA: 3.44,            // Choptuik echo period (massless scalar). Octave length & RG eigenvalue.
  GAMMA: 0.37,            // Choptuik mass-scaling exponent (noted; not used in core loop).
  center: [0.5, 0.5],     // zoom focus, in normalised screen coords
  dprCap: 2,              // device-pixel-ratio cap (perf)
  baseRate: 0.05,         // phase units / second at rate 1.0 (slow, contemplative)
  seamTol: 1e-4,          // continuity assertion tolerance for periodic fields
  keyScrub: 0.005,        // phase step per arrow-key press
  webFade: 0.8,           // seconds to crossfade into/out of cosmic-web mode
  input: {                // touch/pointer: tap = play/pause, horizontal drag = scrub
    dragScrub: 1.1,       // phase units for a full screen-width drag
    tapMaxMove: 8,        // px of movement still counted as a tap (not a drag)
    tapMaxMs: 350,        // max press duration counted as a tap
  },
  morph: {                // STEP 2 — smooth→crystal→collapse + knife-edge fork
    knifeCenter: 0.45,    // phase where the bifurcation peaks (near the knife-edge stage)
    knifeWidth: 0.12,     // gaussian width of the knife-edge window
    forkAmp: 0.03,        // angular tip of the lattice at the knife-edge (fraction of a turn)
  },
  // STEP 4 — conformal crossover. Each effect is a triangular bump {a,peak,b};
  // it is EXACTLY 0 outside [a,b], so every effect vanishes at the seam (b≤1, a≥0)
  // → phase=1 returns identical to the smooth start. Weyl(b=1.0) outlasts the
  // Ricci dip (b<1) so shear persists after isotropic scale is restored.
  crossover: {
    bloom: { a:0.70, peak:0.80, b:0.90,  amp:1.00 },  // Hawking-point flash (BH→evaporation)
    ricci: { a:0.82, peak:0.90, b:0.985, amp:0.85 },  // volume (isotropic) dips toward 0, restores
    weyl:  { a:0.84, peak:0.93, b:0.998, amp:0.45 },  // shear (anisotropic, area-preserving) persists
    rings: { a:0.80, peak:0.90, b:0.99,  amp:1.00 },  // CCC concentric circles seeding the next sky
  },
  // Black hole presence — confined to the BH→Hawking stage so the echoing field
  // stays visible. Drives the 3D raymarch (and 2D background lensing). 0 at the seam.
  bh: { a:0.66, peak:0.78, b:0.88, lensAmp:0.034 },   // lensAmp = max Einstein radius² (screen units)
  // Post-processing (bloom + ACES tonemap). Bloom is a pure function of the
  // seam-safe scene image, so it can't affect the loop.
  post: { bloomThreshold:0.62, bloomStrength:0.95, bloomScale:0.5 },  // scale = bloom-buffer res factor
  confidenceColors: {     // mirror of CSS vars (single source for JS-side use)
    solid: "#5fd0c8", contested: "#e3b56b", interpretive: "#b48cf0",
  },
};

/* ============================================================================
   2. TIMELINE — declarative stage table. Drives caption + label + confidence.
      THE HONESTY LAYER LIVES HERE AS DATA. Contiguous over [0,1).
   ============================================================================ */
const TIMELINE = [
  { phaseStart:0.00, phaseEnd:0.15, id:"smooth",   label:"Smooth spacetime",  confidence:"solid",
    caption:"Far from the threshold, spacetime is smooth — curved gently by mass." },
  { phaseStart:0.15, phaseEnd:0.35, id:"crystal",  label:"Crystallization",   confidence:"solid",
    caption:"Near the black-hole threshold, spacetime freezes into a regular pattern — a spacetime crystal." },
  { phaseStart:0.35, phaseEnd:0.50, id:"knife",    label:"Knife-edge",        confidence:"solid",
    caption:"Balanced on the critical point. Add a sliver of energy and it tips — dissolve, or collapse." },
  { phaseStart:0.50, phaseEnd:0.70, id:"echo",     label:"Echoing",           confidence:"solid",
    caption:"At criticality the solution echoes, repeating at ever-smaller scales. The zoom is a renormalization step; Δ≈3.44 sets its rate." },
  { phaseStart:0.70, phaseEnd:0.85, id:"hawking",  label:"BH → Hawking point", confidence:"contested",
    caption:"A microscopic black hole forms and, over ~10¹⁰⁰ years, evaporates into one concentrated flash. (CCC reading — evidence disputed.)" },
  { phaseStart:0.85, phaseEnd:1.00, id:"crossover",label:"Conformal crossover",confidence:"interpretive",
    caption:"With no mass left, scale loses meaning — the universe is conformally reborn. Only the Weyl (tidal) structure carries through." },
];
// v2 cosmic-web zoom-OUT timeline: structure scales revealed as we pull back.
// Structure formation itself is solid; the rendered specifics are illustrative.
const WEB_TIMELINE = [
  { phaseStart:0.00, phaseEnd:0.20, id:"stars",     label:"Stellar neighbourhood", confidence:"solid",
    caption:"Pulling back from a star-forming region — the smallest knots of the cosmic web." },
  { phaseStart:0.20, phaseEnd:0.40, id:"galaxy",    label:"Galaxies",              confidence:"solid",
    caption:"Billions of stars resolve into galaxies, each seeded by an early collapsed core." },
  { phaseStart:0.40, phaseEnd:0.62, id:"clusters",  label:"Groups & clusters",     confidence:"solid",
    caption:"Galaxies are bound into groups and clusters at the nodes where filaments cross." },
  { phaseStart:0.62, phaseEnd:0.82, id:"filaments", label:"Filaments & voids",     confidence:"interpretive",
    caption:"Matter strings into a web of filaments and sheets, draining the great empty voids between." },
  { phaseStart:0.82, phaseEnd:1.00, id:"web",       label:"Cosmic web",            confidence:"interpretive",
    caption:"The largest scales — the cosmic web toward the horizon, where the next aeon's sky begins." },

function makeStageFinder(table){
  return function(p){
    for (let i=0;i<table.length;i++){ const s=table[i];
      if (p>=s.phaseStart && p<s.phaseEnd) return s; }
    return table[table.length-1];
  };
}
const stageForPhase    = makeStageFinder(TIMELINE);
const stageForPhaseWeb = makeStageFinder(WEB_TIMELINE);

/* ============================================================================
   3. derive() — PURE. phase (+ monotonic counters) → DerivedState.
      No DOM, no GL, no Math.random. The testable core.
      PERIODIC fields (criticality/volume/shear/bloom) MUST satisfy f(0)===f(1).
      >>> STEP 2 & 4 replace the placeholder math with the real staged curves. <<<
   ============================================================================ */
// --- pure helpers for the periodic curves ---
function smoothstep(e0, e1, x){ const t = Math.min(Math.max((x-e0)/(e1-e0), 0), 1); return t*t*(3-2*t); }
// triangular bump: 0 at a, 1 at peak, 0 at b; EXACTLY 0 outside [a,b]. Endpoints
// land on machine-zero, so any effect built from bump(...,b<=1) vanishes at the seam.
function bump(p, a, peak, b){
  if (p <= a || p >= b) return 0;
  return p < peak ? smoothstep(a, peak, p) : 1 - smoothstep(peak, b, p);
}

function derive(phase, logDepth, aeonCount){
  // criticality 0→1→0 over the octave: drives the smooth→crystal→collapse blend.
  // Seam-safe by construction — cos(2π·phase) gives criticality(0)===criticality(1)===0,
  // so the composite field reduces to the plain smooth field at the wrap.
  const criticality = 0.5 - 0.5*Math.cos(2*Math.PI*phase); // 0→1→0

  // Conformal crossover (seam-physical). Each is a bump that is exactly 0 (volume: 1)
  // at the seam, so the rebirth equals the smooth start:
  //   bloom  — Hawking-point flash during BH→evaporation
  //   volume — Ricci / isotropic scale, dips toward 0 then is restored (the rebirth)
  //   shear  — Weyl / anisotropic area-preserving distortion; window reaches the seam
  //            edge so it lingers after volume recovers (only Weyl carries across)
  const x = CONFIG.crossover;
  const bloom  = x.bloom.amp * bump(phase, x.bloom.a, x.bloom.peak, x.bloom.b);
  const volume = 1.0 - x.ricci.amp * bump(phase, x.ricci.a, x.ricci.peak, x.ricci.b);
  const shear  = x.weyl.amp  * bump(phase, x.weyl.a,  x.weyl.peak,  x.weyl.b);
  const rings  = x.rings.amp * bump(phase, x.rings.a, x.rings.peak, x.rings.b);  // CCC circles

  // Black hole: presence (0..1) drives the accretion disk; lens = Einstein radius².
  // Both are 0 outside [a,b] (b<seam) so lensing/disk vanish exactly at the wrap.
  const bhMass = bump(phase, CONFIG.bh.a, CONFIG.bh.peak, CONFIG.bh.b);
  const lens   = bhMass * CONFIG.bh.lensAmp;

  // Knife-edge bifurcation: the lattice tips one way, then the other, as phase
  // crosses the critical point. forkSign carries the direction; sin(2π·phase) is
  // its smooth signed envelope — naturally zero at the balance point AND the seam,
  // gated to the knife-edge by a gaussian window. So forkCue is seam-safe.
  const forkSign = phase < 0.5 ? 1 : -1;                    // ±1 direction (display/logic; v2)
  const m = CONFIG.morph;
  const knife = Math.exp(-Math.pow((phase - m.knifeCenter) / m.knifeWidth, 2));
  const forkCue = Math.sin(2*Math.PI*phase) * knife * m.forkAmp;

  return {
    logDepth, aeonCount,
    phase, criticality, volume, shear, bloom, forkSign, forkCue,
    bh: bhMass, lens, rings,
    stage: stageForPhase(phase),
    zoomRate: 1.0,   // STEP 5: variable pacing
    zoomDir: +1,     // v2: -1 for cosmic-web zoom-out
  };
}

/* ============================================================================
   GUARDRAIL — startup continuity assertion. Periodic fields must match at the seam.
   ============================================================================ */
function assertSeamContinuity(){
  const e = 1e-3;
  const a = derive(e, 0, 0), b = derive(1 - e, 0, 0);
  const fields = ["criticality","volume","shear","bloom","forkCue","bh","lens","rings"];
  for (const f of fields){
    if (Math.abs(a[f] - b[f]) > CONFIG.seamTol){
      console.warn(`[seam] '${f}' discontinuous across wrap: `+
        `f(${e})=${a[f].toFixed(5)} vs f(${1-e})=${b[f].toFixed(5)}. `+
        `The infinite zoom will visibly tear.`);
    }
  }
}

/* ============================================================================
   4. Clock — owns the ONLY mutable state. Reads ?phase=. play/pause/scrub.
   ============================================================================ */
const Clock = {
  phase: 0, aeonCount: 0, playing: true, _last: 0,
  web: 0, webTarget: 0,   // cosmic-web mode crossfade (temporal, not part of the spatial seam)
  init(){
    const q = new URLSearchParams(location.search);
    if (q.has("phase")){ this.phase = ((parseFloat(q.get("phase"))%1)+1)%1; this.playing = false; }
    if (q.has("web")){ this.web = this.webTarget = 1; document.body.classList.add("web"); }
    if (q.has("debug")) document.body.classList.add("debug");
  },
  get logDepth(){ return (this.aeonCount + this.phase) * CONFIG.DELTA; },
  advance(dt){
    // mode crossfade eases regardless of play/pause (it's a temporal blend)
    const d = this.webTarget - this.web;
    if (Math.abs(d) > 1e-4) this.web += Math.sign(d) * Math.min(Math.abs(d), dt / CONFIG.webFade);
    else this.web = this.webTarget;
    if (!this.playing) return;
    // delta-time; variable rate hook (STEP 5) multiplies baseRate by state.zoomRate
    this.phase += CONFIG.baseRate * dt;
    while (this.phase >= 1){ this.phase -= 1; this.aeonCount++; }   // SEAM: wrap, never reset appearance
  },
  toggle(){ this.playing = !this.playing; },
  scrub(d){ this.playing = false; this.phase = ((this.phase + d)%1 + 1)%1; },
  seek(p){ this.playing = false; this.phase = ((p%1)+1)%1; },   // absolute (timeline scrub)
  toggleMode(){
    this.webTarget = this.webTarget > 0.5 ? 0 : 1;
    document.body.classList.toggle("web", this.webTarget > 0.5);
  },
};

/* ============================================================================
   5. GPU sink — owns context/program/uniforms. Fullscreen TRIANGLE (no quad).
      A uniform-adapter maps DerivedState → uniforms (add a uniform in ONE place).
      >>> STEP 1 replaces the placeholder fragment shader with the seamless zoom. <<<
   ============================================================================ */
const GPU = (() => {
  let gl, u = {}, started = 0;

  const VERT = `
    attribute vec2 aPos;
    void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }`;

  // STEP 2 — phase-driven morph over the seamless log-zoom of STEP 1.
  //
  // The log-zoom is unchanged: z = log(r)/Δ - phase, exactly 1-periodic in phase,
  // so the wrap is invisible by construction. On top of it, criticality (0→1→0)
  // blends three self-similar fields:  smooth → crystal lattice → collapse.
  // Because criticality(0)===criticality(1)===0, the composite reduces to the plain
  // smooth field at the seam — the morph CANNOT tear the loop, whatever the lattice
  // and collapse fields look like. u_phase is still the only zoom driver; u_time is
  // cosmetic only.
  const FRAG = `
    #extension GL_OES_standard_derivatives : enable
    precision highp float;
    uniform vec2  u_resolution;
    uniform float u_phase;        // [0,1) — the ONLY thing allowed to drive the zoom
    uniform float u_delta;        // Δ echo period (one octave = one period in log-r)
    uniform float u_criticality;  // 0 smooth → 1 collapse (seam-safe: 0 at the wrap)
    uniform float u_fork;         // knife-edge bifurcation cue (seam-safe; ~0 at wrap)
    uniform float u_volume;       // Ricci / isotropic scale: 1 normal → 0 at crossover (1 at wrap)
    uniform float u_shear;        // Weyl / anisotropic area-preserving distortion (0 at wrap)
    uniform float u_bloom;        // Hawking-point flash intensity (0 at wrap)
    uniform float u_lens;         // gravitational lensing: Einstein radius² (0 at wrap)
    uniform float u_bh;           // black-hole presence 0..1 (accretion disk; 0 at wrap)
    uniform float u_rings;        // CCC Hawking-point concentric circles (0 at wrap)
    uniform float u_web;          // v2 cosmic-web zoom-OUT crossfade 0..1 (temporal, not spatial)
    uniform vec2  u_view;         // 3D parallax look-around (pointer/gyro; phase-independent)
    uniform float u_time;         // COSMETIC ONLY — must never drive the zoom/seam

    #define TAU 6.28318530718

    // cheap hash → [0,1)
    float hash(vec2 p){
      p = fract(p * vec2(127.1, 311.7));
      p += dot(p, p + 34.56);
      return fract(p.x * p.y * 0.5 + 0.5);
    }

    // value noise tiled seamlessly on a period×period torus (both axes wrap)
    float pnoise(vec2 x, float period){
      vec2 i = floor(x), f = fract(x);
      f = f*f*(3.0 - 2.0*f);
      float a = hash(mod(i,               vec2(period)));
      float b = hash(mod(i+vec2(1.0,0.0), vec2(period)));
      float c = hash(mod(i+vec2(0.0,1.0), vec2(period)));
      float d = hash(mod(i+vec2(1.0,1.0), vec2(period)));
      return mix(mix(a,b,f.x), mix(c,d,f.x), f.y);
    }

    // --- field 1: SMOOTH — soft layered noise (the STEP 1 field) ---
    float smoothField(float z, float v, float r){
      float field = 0.0, amp = 0.5, sum = 0.0;
      for (int k = 0; k < 4; k++){
        float N = pow(2.0, float(k) + 1.0);    // 2,4,8,16 cells/period
        float aa = smoothstep(0.0, 0.30, r * N * 0.30);   // centre anti-alias
        field += amp * aa * (pnoise(vec2(z, v) * N, N) - 0.5);
        sum   += amp;  amp *= 0.55;
      }
      return clamp(field / sum + 0.5, 0.0, 1.0);
    }

    // --- field 2: CRYSTAL — a regular lattice (order out of the smooth phase) ---
    // Square cell grid in (z,v); integer cell counts keep both axes seamless.
    float latticeField(float z, float v, float r){
      const float NA = 16.0;                   // angular cells (integer → angular seam ok)
      const float NR = 3.0;                    // radial cells per echo period
      vec2 g = vec2(z * NR, v * NA);
      vec2 c = abs(fract(g) - 0.5);            // distance to cell centre on each axis
      float lines = smoothstep(0.46, 0.5, max(c.x, c.y));   // bright cell walls
      float nodes = smoothstep(0.12, 0.0, length(c));       // bright lattice nodes
      float aa = smoothstep(0.0, 0.22, r);     // fade the fine grid near the centre
      return clamp((lines * 0.6 + nodes) * aa, 0.0, 1.0);
    }

    // --- field 3: COLLAPSE — converging shells + radial filaments + hot core ---
    float collapseField(float z, float v, float r){
      const float SPOKES = 6.0;                // integer → angular seam ok
      float streak = pow(0.5 + 0.5*sin(v*TAU*SPOKES), 4.0);     // sharp filaments
      float shell  = pow(1.0 - abs(fract(z)*2.0 - 1.0), 6.0);   // thin shell each Δ (seam-safe)
      float core   = smoothstep(0.45, 0.0, r);                  // intensifying centre
      return clamp(streak*0.45 + shell*0.7 + core, 0.0, 1.0);
    }

    // --- v2 COSMIC WEB — the zoom-OUT field. Same seamless log-polar framework,
    // but the radial coordinate ADDS phase (zW = u + phase) so structure recedes
    // toward the centre: we pull back to reveal filaments, voids and galaxies.
    // 1-periodic in phase (tiled noise) → seamless in this mode too. Interpretive. ---
    vec3 cosmicWeb(vec2 p){
      float r   = max(length(p), 1e-4);
      float ang = atan(p.y, p.x);
      float u = log(r) / u_delta + 0.5;
      float v = ang / TAU + 0.5;
      float zW = u + u_phase;                  // OPPOSITE sign → zoom out

      // filamentary network via ridged tiled noise (voids between, sheets along)
      float n1 = pnoise(vec2(zW, v) * 3.0, 3.0);
      float n2 = pnoise(vec2(zW, v) * 6.0, 6.0);
      float fil = pow(1.0 - abs(2.0*n1 - 1.0), 3.0) + 0.5 * pow(1.0 - abs(2.0*n2 - 1.0), 4.0);
      fil *= smoothstep(0.0, 0.12, r);

      // galaxies — one hashed point per torus cell (seed BHs grown into early galaxies)
      const float GN = 7.0;
      vec2 gp = vec2(zW, v) * GN;
      vec2 gi = floor(gp), gf = fract(gp) - 0.5;
      vec2 off = (vec2(hash(mod(gi, vec2(GN))), hash(mod(gi + vec2(3.0), vec2(GN)))) - 0.5) * 0.7;
      float gb  = hash(mod(gi + vec2(7.0), vec2(GN)));
      float gal = smoothstep(0.10, 0.0, length(gf - off)) * (0.35 + gb) * smoothstep(0.0, 0.1, r);

      vec3 voidc = vec3(0.010, 0.012, 0.022);                          // empty void
      vec3 filc  = vec3(0.13, 0.15, 0.26);                             // cool filament
      vec3 galc  = mix(vec3(1.0,0.80,0.55), vec3(0.70,0.82,1.0), gb);  // warm/cool galaxies
      vec3 c = mix(voidc, filc, clamp(fil, 0.0, 1.0));
      c += gal * galc * 1.5;
      return c;
    }

    // --- procedural starfield sampled by a 3D direction (the lensed background sky) ---
    vec3 starField(vec3 dir){
      float a = atan(dir.z, dir.x), b = asin(clamp(dir.y, -1.0, 1.0));
      vec2 g = vec2(a/TAU + 0.5, b/3.14159 + 0.5) * 42.0;
      vec2 gi = floor(g), gf = fract(g) - 0.5;
      vec2 c  = (vec2(hash(gi + 1.7), hash(gi + 4.3)) - 0.5) * 0.7;
      float star = smoothstep(0.07, 0.0, length(gf - c)) * pow(hash(gi), 6.0);
      vec3  sc   = mix(vec3(0.7,0.8,1.0), vec3(1.0,0.85,0.7), hash(gi + 9.1));
      return vec3(0.012, 0.015, 0.030) + star * sc * 2.2;     // deep space + a few bright stars
    }

    // --- TRUE 3D black hole — Schwarzschild null-geodesic raymarch (units M=1, rs=2).
    // Integrates the bent photon path; rays that fall in are black (the shadow), rays
    // that graze wind into the photon ring, and the equatorial disk is crossed up to
    // twice → it wraps over the top. Relativistic Doppler + beaming on the disk. ---
    vec3 blackHole3D(vec2 p){
      const float rs = 2.0, rin = 5.5, rout = 22.0;
      float incl = 1.16;                                      // ~66° from the disk normal (see more disk)
      vec3 cam = vec3(0.0, sin(incl), -cos(incl)) * 30.0;
      vec3 fwd = normalize(-cam);
      vec3 rgt = normalize(cross(vec3(0.0,1.0,0.0), fwd));
      vec3 upv = cross(fwd, rgt);
      vec3 dir = normalize(fwd + (p.x*rgt + p.y*upv) * 0.95);

      vec3 pos = cam, vel = dir;
      vec3 hv = cross(pos, vel); float h2 = dot(hv, hv);      // conserved angular momentum²
      vec3 acc_col = vec3(0.0); bool captured = false;

      for (int i = 0; i < 130; i++){
        float r = length(pos);
        if (r < rs){ captured = true; break; }
        if (r > 64.0 && dot(pos, vel) > 0.0) break;           // escaped to infinity
        float dt  = clamp(r * 0.09, 0.20, 2.2);               // adaptive step (fine near the hole)
        // Schwarzschild light-bending + KERR frame-dragging: the gravitomagnetic
        // field of a spinning mass (dipole along the spin axis ŷ) exerts a Lorentz-
        // like force 2·v×B_g that swirls rays around the hole → a lopsided photon
        // ring and a dragged inner disc (the signature of spin).
        vec3  rhat = pos / r;
        vec3  spinAx = vec3(0.0, 1.0, 0.0);
        vec3  Bg = (3.0 * dot(spinAx, rhat) * rhat - spinAx) / (r*r*r);
        vec3  acc = -1.5 * h2 * pos / pow(dot(pos,pos), 2.5) + 2.4 * cross(vel, Bg);
        vec3  nvel = vel + acc * dt;
        vec3  npos = pos + nvel * dt;
        if (pos.y * npos.y < 0.0){                            // crossed the equatorial plane → disk
          vec3 cp = mix(pos, npos, pos.y / (pos.y - npos.y));
          float rd = length(cp.xz);
          if (rd > rin && rd < rout){
            float tn = (rd - rin) / (rout - rin);                        // 0 inner → 1 outer
            float az = atan(cp.z, cp.x);
            // gentle azimuthal density variation, slowly rotating (cosmetic time;
            // bh=0 at seam → safe). Smooth, not spoky.
            float swirl = 0.72 + 0.28*sin(az*3.0 + u_time*0.9);
            float dens  = swirl * smoothstep(rin, rin*1.4, rd) * (1.0 - smoothstep(rout*0.55, rout, rd));
            vec3  vorb = normalize(cross(vec3(0.0,1.0,0.0), cp));        // Keplerian orbital direction
            float beta = 0.46 * sqrt(rin / rd);                          // v/c, faster inward
            float mu   = dot(vorb, -normalize(vel));                     // line-of-sight component
            float dop  = 1.0 / (1.0 - beta * mu + 1e-3);                 // Doppler factor δ
            float beam = pow(clamp(dop, 0.1, 4.0), 3.0);                 // beaming ∝ δ³
            vec3  temp = mix(vec3(1.0,0.95,0.80), vec3(1.0,0.45,0.15), tn); // hot white-ish inner → orange
            vec3  tint = mix(vec3(1.0,0.42,0.18), vec3(0.70,0.85,1.0), clamp((dop-0.55)/0.9, 0.0, 1.0));
            acc_col += temp * tint * dens * beam * (0.6 + (1.0 - tn) * 1.4);  // inner edge blazes
          }
        }
        pos = npos; vel = nvel;
      }
      vec3 bg = captured ? vec3(0.0) : starField(normalize(vel));
      return bg + acc_col * 0.9;
    }

    void main(){
      vec2 uv0 = (gl_FragCoord.xy - 0.5*u_resolution) / u_resolution.y;   // screen-centred

      // 3D PARALLAX — pointer/gyro look-around. The outer wall (large radius) swims
      // more than the deep centre (small radius), so the funnel reads as a real 3D
      // well you peer into. u_view is phase-independent → the spatial seam is untouched.
      uv0 += u_view * (0.22 + dot(uv0, uv0) * 1.6);

      // WEYL shear — anisotropic, AREA-PRESERVING (det=1) hyperbolic boost: squeeze
      // along one diagonal, stretch the other. Identity at the seam (u_shear=0), so it
      // distorts only through the crossover. This is the conformally-invariant piece.
      float ch = 0.5*(exp(u_shear) + exp(-u_shear));
      float sh = 0.5*(exp(u_shear) - exp(-u_shear));
      vec2 uv = mat2(ch, sh, sh, ch) * uv0;

      float r   = max(length(uv), 1e-4);       // screen radius (after shear)
      float ang = atan(uv.y, uv.x);            // [-π,π]

      // GRAVITATIONAL LENSING — a point-mass lens bends the background field. The
      // source-plane radius is β = θ − θE²/θ (the thin-lens equation); u_lens = θE².
      // Infinite magnification at θ=θE makes the Einstein ring. Identity at the seam
      // (u_lens=0), so the spatial loop is untouched.
      float rSrc  = r - u_lens / r;
      float rLens = max(abs(rSrc), 1e-4);

      // log-polar coordinates; zoom-IN: subtract phase (camera falls inward forever)
      float u = log(rLens) / u_delta + 0.5;    // field reads the LENSED radius
      float v = ang / TAU + 0.5;               // angle in [0,1); torus wraps the seam
      float z = u - u_phase;                   // the only phase term — 1-periodic

      // knife-edge tip: a tiny angular skew of the ordered fields (seam-safe via u_fork)
      float vF = v + u_fork;

      // three palettes (dark observatory base; sharp accents per regime)
      vec3 SM_LO = vec3(0.015,0.022,0.038), SM_HI = vec3(0.10,0.16,0.26);  // smooth: deep blue
      vec3 LT_LO = vec3(0.02, 0.04, 0.055),  LT_HI = vec3(0.30,0.66,0.70); // crystal: cyan
      vec3 CO_LO = vec3(0.05, 0.02, 0.05),   CO_HI = vec3(0.78,0.42,0.62); // collapse: hot violet

      vec3 cSmooth   = mix(SM_LO, SM_HI, smoothField(z, v,  r));
      vec3 cLattice  = mix(LT_LO, LT_HI, latticeField(z, vF, r));
      vec3 cCollapse = mix(CO_LO, CO_HI, collapseField(z, vF, r));

      // compose by criticality: smooth →(0..0.55)→ lattice →(0.45..1)→ collapse
      float a = smoothstep(0.0, 0.55, u_criticality);
      float b = smoothstep(0.45, 1.0, u_criticality);
      vec3 col = mix(cSmooth, cLattice, a);
      col = mix(col, cCollapse, b);

      // faint echo-shell hairlines at each Δ boundary — periodic, cannot tear the seam
      float shell = fract(z);
      float line  = smoothstep(0.0, 0.035, shell) * smoothstep(0.0, 0.035, 1.0 - shell);
      col += (1.0 - line) * vec3(0.05, 0.10, 0.16) * smoothstep(0.0, 0.15, r);

      // calm core: fade to base toward the centre (the point we fall into)
      col = mix(SM_LO, col, smoothstep(0.0, 0.05, r));

      // GRAVITATIONAL REDSHIFT — light climbing out of the well is reddened and
      // dimmed toward the deep centre, more so near criticality. Radial (r-based) →
      // phase-independent → seam-safe.
      float gr = smoothstep(0.5, 0.0, r) * (0.10 + 0.32 * u_criticality);
      col *= mix(vec3(1.0), vec3(1.03, 0.80, 0.62), gr);

      // RELIEF SHADING — emboss the structure from its own luminance gradient so the
      // lattice/collapse read as 3D surfaces, not flat. Strength rises with criticality
      // (→0 at the seam). Compiled in only where screen-space derivatives exist.
      #ifdef HAS_DERIV
      float emb = mix(0.12, 1.0, u_criticality);
      float hgt = dot(col, vec3(0.299, 0.587, 0.114));
      vec3  nrm = normalize(vec3(-dFdx(hgt) * 110.0 * emb, -dFdy(hgt) * 110.0 * emb, 1.0));
      float dif = clamp(dot(nrm, normalize(vec3(0.42, 0.6, 0.7))), 0.0, 1.0);
      col *= 0.84 + 0.40 * dif;
      #endif

      // ===== BLACK HOLE — TRUE 3D Schwarzschild raymarch =====================
      // While the hole exists, crossfade the whole view to a real 3D black hole
      // (bent geodesics → photon ring, disk wrapping over the top, Doppler). The
      // crossfade presence is 0 at the seam, so the loop is untouched; the branch
      // is coherent (same for all pixels) so it costs nothing the rest of the time.
      // snap to a full black hole quickly so the busy field underneath can't bleed
      // through into a muddy blend (only a brief crossfade at the window edges).
      float bhMix = smoothstep(0.04, 0.22, u_bh);
      if (bhMix > 0.001) col = mix(col, blackHole3D(uv0), bhMix);

      // RICCI / volume — isotropic scale loss. As volume→0 the field washes toward a
      // scaleless tone (scale stops meaning anything). Restored to 1 at the seam, and
      // it recovers BEFORE the shear window closes, so the sheared (Weyl) structure is
      // what remains visible into the rebirth — "only the Weyl curvature carries across".
      vec3 scaleless = vec3(0.03, 0.035, 0.05);
      col = mix(scaleless, col, clamp(u_volume, 0.0, 1.0));

      // HAWKING-POINT bloom — one concentrated central flash (screen-centred, so the
      // shear can't smear it). Seeds the next octave's field. Zero at the seam.
      float r0    = length(uv0);
      float flash = exp(-r0*r0*36.0);          // tight hot core
      float halo  = exp(-r0*r0*4.0) * 0.5;     // soft surrounding glow
      col += u_bloom * (flash + halo) * vec3(1.0, 0.86, 0.62);

      // CCC HAWKING-POINT RINGS — concentric low-variance circles imprinted around
      // the point, seeding the next aeon's sky (the *contested* CMB signature).
      // Centred on screen, faded at centre/edge; u_rings is 0 at the seam.
      float circ = pow(0.5 + 0.5*cos(r0 * 26.0 * TAU), 8.0);     // thin bright circles
      float rfade = smoothstep(0.04, 0.12, r0) * (1.0 - smoothstep(0.45, 0.85, r0));
      col += u_rings * circ * rfade * vec3(0.55, 0.78, 1.0) * 0.5;

      // v2 COSMIC WEB — crossfade to the zoom-OUT field. u_web is a temporal mode
      // blend (not phase-driven), and both fields are seam-safe, so the spatial loop
      // stays exact at every value of u_web.
      if (u_web > 0.0) col = mix(col, cosmicWeb(uv0), u_web);

      // faint cosmetic grain (allowed — does not touch the zoom/seam)
      float g = hash(gl_FragCoord.xy + fract(u_time));
      col += (g - 0.5) * 0.010;

      gl_FragColor = vec4(col, 1.0);
    }`;

  // ---- post-processing: bright-pass + separable Gaussian blur, then composite ----
  // Bloom is a pure function of the scene image; since the scene is seam-safe,
  // the post chain is too. RGBA8 targets (no float-texture extension needed).
  const BLUR = `
    precision highp float;
    uniform sampler2D u_tex;
    uniform vec2  u_res;       // target resolution
    uniform vec2  u_step;      // blur offset in uv per tap
    uniform float u_thresh;    // >0: bright-pass extraction (first/H pass)
    vec3 samp(vec2 uv){
      vec3 c = texture2D(u_tex, uv).rgb;
      if (u_thresh > 0.0){
        float l = max(max(c.r, c.g), c.b);
        c *= smoothstep(u_thresh, u_thresh + 0.35, l);
      }
      return c;
    }
    void main(){
      vec2 uv = gl_FragCoord.xy / u_res;
      vec3 s = samp(uv) * 0.227027;
      s += (samp(uv + u_step      ) + samp(uv - u_step      )) * 0.194594;
      s += (samp(uv + u_step*2.0  ) + samp(uv - u_step*2.0  )) * 0.121622;
      s += (samp(uv + u_step*3.0  ) + samp(uv - u_step*3.0  )) * 0.054054;
      s += (samp(uv + u_step*4.0  ) + samp(uv - u_step*4.0  )) * 0.016216;
      gl_FragColor = vec4(s, 1.0);
    }`;

  const COMP = `
    precision highp float;
    uniform sampler2D u_scene;
    uniform sampler2D u_bloom;
    uniform vec2  u_res;
    uniform float u_strength;
    // ACES filmic tonemap (Narkowicz approximation)
    vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
    void main(){
      vec2 uv = gl_FragCoord.xy / u_res;
      // subtle, constant chromatic aberration toward the edges (phase-independent → seam-safe)
      vec2 d = uv - 0.5;
      float ca = dot(d, d) * 0.006;
      vec3 scene = vec3(
        texture2D(u_scene, uv + d*ca).r,
        texture2D(u_scene, uv).g,
        texture2D(u_scene, uv - d*ca).b);
      vec3 bloom = texture2D(u_bloom, uv).rgb;
      gl_FragColor = vec4(aces(scene + bloom * u_strength), 1.0);
    }`;

  function compile(type, src){
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS))
      throw new Error("shader compile: " + gl.getShaderInfoLog(s));
    return s;
  }
  function link(vsrc, fsrc){
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS))
      throw new Error("program link: " + gl.getProgramInfoLog(p));
    return p;
  }

  let sceneProg, blurProg, compProg, bu = {}, cu = {}, quad;
  let aScene = 0, aBlur = 0, aComp = 0;
  // render targets {tex, fbo, w, h}
  let scene = null, bloomA = null, bloomB = null, W = 0, H = 0;

  function makeTarget(w, h){
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fbo, w, h };
  }
  function disposeTarget(t){ if (t){ gl.deleteTexture(t.tex); gl.deleteFramebuffer(t.fbo); } }

  function init(canvas){
    gl = canvas.getContext("webgl") || canvas.getContext("experimental-webgl");
    if (!gl) throw new Error("WebGL unavailable");
    // relief shading needs screen-space derivatives; compile it in only if available
    const hasDeriv = !!gl.getExtension("OES_standard_derivatives");
    const fragSrc  = (hasDeriv ? "#define HAS_DERIV 1\n" : "") + FRAG;

    sceneProg = link(VERT, fragSrc);
    blurProg  = link(VERT, BLUR);
    compProg  = link(VERT, COMP);
    aScene = gl.getAttribLocation(sceneProg, "aPos");
    aBlur  = gl.getAttribLocation(blurProg,  "aPos");
    aComp  = gl.getAttribLocation(compProg,  "aPos");

    // fullscreen triangle (covers clip space; no diagonal seam)
    quad = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);

    u = {
      resolution:  gl.getUniformLocation(sceneProg, "u_resolution"),
      phase:       gl.getUniformLocation(sceneProg, "u_phase"),
      delta:       gl.getUniformLocation(sceneProg, "u_delta"),
      criticality: gl.getUniformLocation(sceneProg, "u_criticality"),
      fork:        gl.getUniformLocation(sceneProg, "u_fork"),
      volume:      gl.getUniformLocation(sceneProg, "u_volume"),
      shear:       gl.getUniformLocation(sceneProg, "u_shear"),
      bloom:       gl.getUniformLocation(sceneProg, "u_bloom"),
      lens:        gl.getUniformLocation(sceneProg, "u_lens"),
      bh:          gl.getUniformLocation(sceneProg, "u_bh"),
      rings:       gl.getUniformLocation(sceneProg, "u_rings"),
      web:         gl.getUniformLocation(sceneProg, "u_web"),
      view:        gl.getUniformLocation(sceneProg, "u_view"),
      time:        gl.getUniformLocation(sceneProg, "u_time"),
    };
    bu = { tex: gl.getUniformLocation(blurProg, "u_tex"), res: gl.getUniformLocation(blurProg, "u_res"),
           step: gl.getUniformLocation(blurProg, "u_step"), thresh: gl.getUniformLocation(blurProg, "u_thresh") };
    cu = { scene: gl.getUniformLocation(compProg, "u_scene"), bloom: gl.getUniformLocation(compProg, "u_bloom"),
           res: gl.getUniformLocation(compProg, "u_res"), strength: gl.getUniformLocation(compProg, "u_strength") };

    gl.useProgram(sceneProg);
    gl.uniform1f(u.delta, CONFIG.DELTA);   // Δ is constant; set once
    started = performance.now();
  }

  function resize(canvas){
    const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.dprCap);
    const w = Math.max(1, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(1, Math.floor(canvas.clientHeight * dpr));
    if (canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    if (w === W && h === H && scene) return;            // size unchanged → keep targets
    W = w; H = h;
    const bs = CONFIG.post.bloomScale;
    const bw = Math.max(1, Math.floor(W * bs)), bh2 = Math.max(1, Math.floor(H * bs));
    disposeTarget(scene); disposeTarget(bloomA); disposeTarget(bloomB);
    scene  = makeTarget(W, H);
    bloomA = makeTarget(bw, bh2);
    bloomB = makeTarget(bw, bh2);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  function drawQuad(aLoc){
    gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.enableVertexAttribArray(aLoc);
    gl.vertexAttribPointer(aLoc, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  // uniform-adapter + multi-pass: scene → bright/blur(H) → blur(V) → composite
  function render(state, web, view){
    const P = CONFIG.post;

    // PASS A — render the scene into the scene target
    gl.bindFramebuffer(gl.FRAMEBUFFER, scene.fbo);
    gl.viewport(0, 0, W, H);
    gl.useProgram(sceneProg);
    gl.uniform2f(u.resolution, W, H);
    gl.uniform1f(u.phase, state.phase);   // [0,1) — the only zoom driver
    gl.uniform1f(u.criticality, state.criticality);
    gl.uniform1f(u.fork, state.forkCue);
    gl.uniform1f(u.volume, state.volume);
    gl.uniform1f(u.shear, state.shear);
    gl.uniform1f(u.bloom, state.bloom);
    gl.uniform1f(u.lens, state.lens);
    gl.uniform1f(u.bh, state.bh);
    gl.uniform1f(u.rings, state.rings);
    gl.uniform1f(u.web, web || 0);
    gl.uniform2f(u.view, view ? view.x : 0, view ? view.y : 0);
    gl.uniform1f(u.time, (performance.now() - started) / 1000);
    drawQuad(aScene);

    // PASS B — bright-pass + horizontal blur into bloomA
    gl.useProgram(blurProg);
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.fbo);
    gl.viewport(0, 0, bloomA.w, bloomA.h);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);
    gl.uniform1i(bu.tex, 0);
    gl.uniform2f(bu.res, bloomA.w, bloomA.h);
    gl.uniform2f(bu.step, 1.0 / scene.w, 0.0);
    gl.uniform1f(bu.thresh, P.bloomThreshold);
    drawQuad(aBlur);

    // PASS C — vertical blur into bloomB (no threshold)
    gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.fbo);
    gl.viewport(0, 0, bloomB.w, bloomB.h);
    gl.bindTexture(gl.TEXTURE_2D, bloomA.tex);
    gl.uniform2f(bu.res, bloomB.w, bloomB.h);
    gl.uniform2f(bu.step, 0.0, 1.0 / bloomA.h);
    gl.uniform1f(bu.thresh, 0.0);
    drawQuad(aBlur);

    // PASS D — composite (scene + bloom) with ACES tonemap, to the canvas
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, W, H);
    gl.useProgram(compProg);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, scene.tex);  gl.uniform1i(cu.scene, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomB.tex); gl.uniform1i(cu.bloom, 1);
    gl.uniform2f(cu.res, W, H);
    gl.uniform1f(cu.strength, P.bloomStrength);
    drawQuad(aComp);
  }
  return { init, resize, render };
})();

/* ============================================================================
   6. HUD sink — scientific-instrument readout. Reads `phase`/`stage` off the
      shared state. Playhead moves every frame (cheap); text is diffed and
      throttled ~10 Hz so the DOM isn't rewritten on frames where nothing changed.
   ============================================================================ */
// Physical scale at a given zoom depth (illustrative). L = exp(±logDepth) metres,
// anchored at 1 m; zoom-in shrinks toward the Planck length, zoom-out grows to the
// cosmic horizon. Returns a "1.2e-15 m" string and a named regime.
function scaleReadout(logDepth, isWeb){
  const g = (isWeb ? 1 : -1) * logDepth * 0.43429448;   // log10(L)
  const e = Math.floor(g);
  const num = `${Math.pow(10, g - e).toFixed(1)}e${e} m`;
  const rg = isWeb
    ? (g<9?"planetary":g<13?"stellar":g<16?"interstellar":g<19?"stellar neighbourhood":
       g<22?"galactic":g<24?"clusters":g<26.94?"cosmic web":"beyond the horizon")
    : (g>0?"macroscopic":g>-3?"human–mm":g>-6?"cellular":g>-9?"molecular":
       g>-10.3?"atomic":g>-14?"sub-atomic":g>-15.3?"nuclear":g>-18?"quark scale":
       g>-35?"pre-geometric":"sub-Planckian");
  return { num, rg };
}

const HUD = (() => {
  const el = {}; let lastText = 0, cache = {};
  function init(){
    ["r-phase","r-aeon","r-depth","r-delta","r-scale","r-regime","caption","chip-label","chip-conf",
     "r-state","tl-track","tl-head"].forEach(id => el[id] = document.getElementById(id));
    el.chip = document.getElementById("chip");
    el.choptuik = document.getElementById("choptuik");
    el.ckDot = document.getElementById("ck-dot");
    el.penDot = document.getElementById("pen-dot");
    el["r-delta"].textContent = CONFIG.DELTA.toFixed(2);

    // build BOTH stage timelines once (honesty layer as data). CSS shows the set
    // matching the mode (body.web). Each segment is tinted by its confidence.
    const build = (table, klass) => table.map(s => {
      const seg = document.createElement("div");
      seg.className = "tl-seg " + klass + " c-" + s.confidence;
      seg.style.left  = (s.phaseStart * 100) + "%";
      seg.style.width = ((s.phaseEnd - s.phaseStart) * 100) + "%";
      el["tl-track"].appendChild(seg);
      return seg;
    });
    el.segsAeon = build(TIMELINE, "seg-aeon");
    el.segsWeb  = build(WEB_TIMELINE, "seg-web");
  }
  function set(id, val){ if (cache[id] !== val){ cache[id] = val; el[id].textContent = val; } }

  function update(state, now, playing, web){
    // playhead every frame — smooth, just one style write
    el["tl-head"].style.left = (state.phase * 100) + "%";

    if (now - lastText < 100) return;          // ~10 Hz for the diffed text
    lastText = now;
    set("r-phase", state.phase.toFixed(3));
    set("r-aeon", String(state.aeonCount));
    set("r-depth", state.logDepth.toFixed(2));
    set("r-state", playing ? "▸ running" : "‖ paused");

    // scale ruler — physical scale at this zoom depth, and its regime
    const sc = scaleReadout(state.logDepth, web > 0.5);
    set("r-scale", sc.num);
    set("r-regime", "· " + sc.rg);

    // Penrose CCC inset — the marker rises through the current aeon (Big Bang at the
    // bottom, crossover at the top). Hidden in cosmic-web mode via CSS.
    if (web <= 0.5) el.penDot.setAttribute("cy", (61 - state.phase * 26).toFixed(1));

    // pick the timeline for the current mode; each has its own stages + segments
    const isWeb = web > 0.5;
    const table = isWeb ? WEB_TIMELINE : TIMELINE;
    const segs  = isWeb ? el.segsWeb   : el.segsAeon;
    const s = (isWeb ? stageForPhaseWeb : stageForPhase)(state.phase);
    set("chip-label", s.label);
    set("chip-conf", s.confidence);
    set("caption", s.caption);

    // confidence drives the single accent (CSS var via data attribute)
    if (cache.conf !== s.confidence){
      cache.conf = s.confidence;
      el.chip.dataset.conf = s.confidence;
      document.body.dataset.conf = s.confidence;   // --accent for dock/state
    }
    // highlight the active segment (track the DOM node so mode-switches clear cleanly)
    const active = segs[table.indexOf(s)] || null;
    if (cache.activeSeg !== active){
      if (cache.activeSeg) cache.activeSeg.classList.remove("on");
      if (active) active.classList.add("on");
      cache.activeSeg = active;
    }

    // Choptuik mass-scaling inset — visible through the critical-collapse stages
    // (aeon mode). The marker rides the slope-γ log-log line: ε = p−p* ∝ (1−crit);
    // as criticality rises ε→0 and M ∝ ε^γ → 0, so the dot slides to the origin.
    const showCk = !isWeb && state.criticality > 0.22;
    if (cache.ck !== showCk){ cache.ck = showCk; el.choptuik.classList.toggle("show", showCk); }
    if (showCk){
      const eps = Math.min(Math.max(1 - state.criticality, 1e-3), 1);
      const t = (Math.log10(eps) + 3) / 3;          // 0 (at ε=1e-3) … 1 (at ε=1)
      el.ckDot.setAttribute("cx", (14 + t * 90).toFixed(1));
      el.ckDot.setAttribute("cy", (50.5 - t * 42.5).toFixed(1));
    }
  }
  return { init, update };
})();

   DEBUG overlay (?debug)
   ============================================================================ */
function debugText(state){
  const d = document.getElementById("debug");
  if (!document.body.classList.contains("debug")) return;
  d.textContent =
    `phase       ${state.phase.toFixed(4)}\n`+
    `criticality ${state.criticality.toFixed(4)}\n`+
    `volume      ${state.volume.toFixed(4)}\n`+
    `shear       ${state.shear.toFixed(4)}\n`+
    `bloom       ${state.bloom.toFixed(4)}\n`+
    `forkSign    ${state.forkSign}\n`+
    `stage       ${state.stage.id}\n`+
    `aeon        ${state.aeonCount}   depth ${state.logDepth.toFixed(2)}`;
}

/* ============================================================================
   Composition root — thin rAF loop wiring the four steps.
   ============================================================================ */
function main(){
  const canvas = document.getElementById("gl");
  try {
    GPU.init(canvas);
  } catch (err){
    const f = document.getElementById("fatal");
    f.style.display = "grid";
    f.textContent = "Could not start WebGL.\n\n" + err.message;
    return;
  }
  HUD.init();
  Clock.init();
  assertSeamContinuity();

  // Fullscreen — hides browser chrome for full immersion. Standard API with a
  // webkit fallback (older Safari); feature-detected so the button hides on
  // platforms that lack element fullscreen (iPhone Safari → use Add to Home Screen).
  const docEl = document.documentElement;
  const fsBtn = document.getElementById("fs-btn");
  const fsSupported = !!(docEl.requestFullscreen || docEl.webkitRequestFullscreen);
  const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
  function toggleFullscreen(){
    if (!fsSupported) return;
    if (fsElement()){
      const exit = document.exitFullscreen || document.webkitExitFullscreen;
      if (exit) exit.call(document);
    } else {
      const req = docEl.requestFullscreen || docEl.webkitRequestFullscreen;
      if (req){ const p = req.call(docEl); if (p && p.catch) p.catch(() => {}); }
    }
  }
  function syncFullscreen(){ document.body.classList.toggle("fs", !!fsElement()); }
  if (!fsSupported) document.body.classList.add("no-fs");
  fsBtn.addEventListener("click", toggleFullscreen);
  document.addEventListener("fullscreenchange", syncFullscreen);
  document.addEventListener("webkitfullscreenchange", syncFullscreen);

  // Show/hide the text overlay (HUD) for a clean, immersive view. Buttons stay.
  const hudBtn = document.getElementById("hud-btn");
  function toggleHud(){
    const hidden = document.body.classList.toggle("hud-hidden");
    hudBtn.setAttribute("aria-pressed", String(hidden));
  }
  hudBtn.addEventListener("click", toggleHud);

  // Cosmic-web zoom-OUT mode (v2): crossfade between the aeon and the cosmic web.
  const modeBtn = document.getElementById("mode-btn");
  function toggleMode(){
    Clock.toggleMode();
    modeBtn.setAttribute("aria-pressed", String(Clock.webTarget > 0.5));
  }
  modeBtn.addEventListener("click", toggleMode);

  let last = performance.now();
  document.addEventListener("keydown", e => {
    if (e.code === "Space"){ e.preventDefault(); Clock.toggle(); }
    if (e.code === "ArrowRight") Clock.scrub(+CONFIG.keyScrub);
    if (e.code === "ArrowLeft")  Clock.scrub(-CONFIG.keyScrub);
    if (e.code === "KeyF"){ e.preventDefault(); toggleFullscreen(); }
    if (e.code === "KeyH"){ e.preventDefault(); toggleHud(); }
    if (e.code === "KeyM"){ e.preventDefault(); toggleMode(); }
  });

  // Touch / pointer input (covers mouse, touch and pen via Pointer Events):
  //   tap            → play/pause
  //   horizontal drag → scrub (delta-mapped to phase; never tears the spatial seam)
  // Pure JS-side: it only nudges the Clock, so the shader contract is untouched.
  const IN = CONFIG.input;
  let ptr = { active:false, id:-1, x0:0, y0:0, lastX:0, scrubbing:false, t0:0 };
  canvas.addEventListener("pointerdown", e => {
    ptr = { active:true, id:e.pointerId, x0:e.clientX, y0:e.clientY,
            lastX:e.clientX, scrubbing:false, t0:performance.now() };
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!ptr.active || e.pointerId !== ptr.id) return;
    if (!ptr.scrubbing &&
        Math.hypot(e.clientX - ptr.x0, e.clientY - ptr.y0) > IN.tapMaxMove) {
      ptr.scrubbing = true;                       // crossed the slop → it's a drag
    }
    if (ptr.scrubbing) {
      const dx = e.clientX - ptr.lastX;
      Clock.scrub(dx / window.innerWidth * IN.dragScrub);
    }
    ptr.lastX = e.clientX;
  });
  function endPtr(e){
    if (!ptr.active || e.pointerId !== ptr.id) return;
    if (!ptr.scrubbing && performance.now() - ptr.t0 < IN.tapMaxMs) Clock.toggle();  // tap
    ptr.active = false;
  }
  canvas.addEventListener("pointerup", endPtr);
  canvas.addEventListener("pointercancel", endPtr);

  // Timeline scrubbing — drag (or click) anywhere on the strip to seek that phase.
  const timeline = document.getElementById("timeline");
  let tlActive = false;
  function seekFromEvent(e){
    const rect = timeline.getBoundingClientRect();
    Clock.seek((e.clientX - rect.left) / rect.width);
  }
  timeline.addEventListener("pointerdown", e => {
    tlActive = true; seekFromEvent(e);
    if (timeline.setPointerCapture) timeline.setPointerCapture(e.pointerId);
  });
  timeline.addEventListener("pointermove", e => { if (tlActive) seekFromEvent(e); });
  const endTl = () => { tlActive = false; };
  timeline.addEventListener("pointerup", endTl);
  timeline.addEventListener("pointercancel", endTl);

  // 3D PARALLAX look-around — pointer (desktop) or gyro (mobile) tilts the view;
  // with no input, a gentle drift keeps the depth alive. Phase-independent → the
  // spatial seam is never touched. Eased toward a target each frame.
  const VIEW_AMP = 0.055;
  const view = { x:0, y:0 }, vt = { x:0, y:0 };
  let lastInput = 0, hadPointer = false, gyro = false;
  const clampV = (x) => Math.min(Math.max(x, -1), 1);
  window.addEventListener("pointermove", e => {
    hadPointer = true; lastInput = performance.now();
    vt.x =  (e.clientX / window.innerWidth  - 0.5) * 2 * VIEW_AMP;
    vt.y = -(e.clientY / window.innerHeight - 0.5) * 2 * VIEW_AMP;
  });
  window.addEventListener("deviceorientation", e => {
    if (e.gamma == null && e.beta == null) return;
    gyro = true; lastInput = performance.now();
    vt.x = clampV((e.gamma || 0) / 40) * VIEW_AMP;
    vt.y = clampV(((e.beta || 45) - 45) / 40) * VIEW_AMP;
  }, true);

  document.addEventListener("visibilitychange", () => { if (document.hidden) Clock.playing = false; });

  // survive context loss
  canvas.addEventListener("webglcontextlost", e => { e.preventDefault(); Clock.playing = false; });

  function frame(now){
    const dt = Math.min((now - last) / 1000, 0.1); last = now;     // delta-time, clamped

    // parallax target: ease toward input, or a slow drift when there's none (touch/idle)
    if (!hadPointer && !gyro){
      const t = now * 0.001;
      vt.x = Math.sin(t * 0.30) * 0.5 * VIEW_AMP;
      vt.y = Math.cos(t * 0.23) * 0.4 * VIEW_AMP;
    }
    const k = Math.min(1, dt * 3.5);
    view.x += (vt.x - view.x) * k;
    view.y += (vt.y - view.y) * k;

    Clock.advance(dt);
    GPU.resize(canvas);
    const state = derive(Clock.phase, Clock.logDepth, Clock.aeonCount);  // PURE
    GPU.render(state, Clock.web, view);            // sink 1
    HUD.update(state, now, Clock.playing, Clock.web); // sink 2
    debugText(state);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}
main();
</script>
